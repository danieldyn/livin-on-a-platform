name: Deploy LOAP to GitHub Pages

on:
  push:
    branches:
      - ghp-deployment
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: "pip"

      - name: Install dependencies & Pygbag
        run: |
          python -m pip install --upgrade pip
          pip install pygbag pygame-ce

      - name: Build WebAssembly bundle
        run: |
          python -m pygbag --archive .

      - name: Deploy to GitHub Pages branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: build/web
          branch: gh-pages
